name: pp4ckd
channels:
  - conda-forge
  - defaults
dependencies:
  # Python version
  - python=3.10

  # Core scientific computing packages
  - numpy>=1.24.0
  - pandas>=2.0.0
  - scikit-learn>=1.3.0
  - joblib>=1.3.0

  # Cheminformatics
  - rdkit>=2023.3.1

  # Visualization (optional, for Python-side plotting)
  - matplotlib>=3.7.0
  - seaborn>=0.12.0

  # Jupyter (optional, for development and debugging)
  - jupyter
  - ipykernel

  # pip-installed packages
  - pip
  - pip:
      - mhfp>=1.9.6  # Molecular fingerprint MHFP6

# Environment creation command:
# conda env create -f environment.yml

# Environment activation command:
# conda activate pp4ckd

# Environment update command:
# conda env update -f environment.yml --prune

# Environment export command (with exact versions):
# conda env export > environment_exact.yml

# Environment removal command:
# conda env remove -n pp4ckd
