[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pp4ckd"
version = "0.1.0"
description = "High-performance multi-target ligand-based deep learning framework for chronic kidney disease targets"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "CKDdb Team" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "torch>=2.0.0",
    "rdkit>=2022.9.1",
    "numpy>=1.22.0,<2.0.0",
    "scipy>=1.9.0",
    "pandas>=1.4.0",
    "scikit-learn>=1.1.0",
    "mhfp>=1.9.6",
    "tqdm>=4.64.0",
]

[project.scripts]
pp4ckd = "pp4ckd.predictor:main"

[project.urls]
Homepage = "https://github.com/jixing475/pp4ckd"
Repository = "https://github.com/jixing475/pp4ckd.git"
"Bug Tracker" = "https://github.com/jixing475/pp4ckd/issues"

[tool.setuptools.packages.find]
include = ["pp4ckd*"]
